name: HomePlanner map data connectivity
on:
  push:
    branches: [access-map-evidence-20261008]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check data endpoints without publishing a map
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          urls = {
              "geolonia_v2": "https://japanese-addresses-v2.geoloniamaps.com/api/ja.json",
              "mlit_n02": "https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-N02-2025.html"
          }
          for name, url in urls.items():
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "MapEvidenceCheck/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      print(name, "HTTP", r.status, "content_type", r.headers.get("Content-Type"))
              except Exception as e:
                  print(name, "FAILED", type(e).__name__, str(e)[:100])
          print("Diagnostic only; no SVG, PNG, or property coordinate inferred.")
          PY
