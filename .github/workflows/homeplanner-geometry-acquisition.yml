name: HomePlanner source-backed geometry acquisition
on:
  push:
    branches: [access-map-evidence-20261008]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned MVT decoder
        run: python -m pip install --quiet 'mapbox-vector-tile==2.2.0'
      - name: Fetch official raw road and rail evidence
        run: python access-map-diagnostic/acquire_official_geometry.py
      - name: Upload diagnostic evidence only
        uses: actions/upload-artifact@v4
        with:
          name: homeplanner-official-geodata-diagnostic
          path: official-geometry-output/
          retention-days: 7
          if-no-files-found: error
