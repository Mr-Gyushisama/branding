name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html enhancements.css enhancements.js .nojekyll _site/
          cp property-form.html property-form.css property-form.js _site/
          cp property-template.html property-template.css property-template.js _site/
          cp mock-verde-court.html mock-verde-court.json _site/
          python - <<'PY'
          from pathlib import Path
          p = Path("_site/index.html")
          s = p.read_text(encoding="utf-8")
          if "enhancements.css" not in s:
              s = s.replace("</head>", '<link rel="stylesheet" href="enhancements.css"></head>')
          if "enhancements.js" not in s:
              s = s.replace("</body>", '<script src="enhancements.js"></script></body>')
          p.write_text(s, encoding="utf-8")
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
