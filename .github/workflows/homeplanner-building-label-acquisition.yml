name: HomePlanner verified building and labels acquisition
on:
  push:
    branches: [access-map-evidence-20261008]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MVT decoder
        run: python -m pip install --quiet 'mapbox-vector-tile==2.2.0'
      - name: Acquire GSI building geometry and names
        run: python access-map-diagnostic/acquire_buildings_labels.py
      - name: Archive verified raw evidence
        uses: actions/upload-artifact@v4
        with:
          name: homeplanner-building-label-evidence
          path: access-map-building-evidence/
          retention-days: 7
          if-no-files-found: error
