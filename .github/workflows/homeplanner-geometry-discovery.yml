name: HomePlanner geometry source discovery
on:
  push:
    branches: [access-map-evidence-20261008]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Install MVT decoder
        run: python -m pip install --quiet 'mapbox-vector-tile==2.2.0'
      - name: Probe official geometry sources
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,math,hashlib
          from pathlib import Path
          from datetime import datetime,timezone
          import mapbox_vector_tile
          lon,lat=136.879676298,35.191603876
          z=15
          x=int((lon+180)/360*2**z)
          y=int((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*2**z)
          out={"generated_at_utc":datetime.now(timezone.utc).isoformat(),
               "purpose":"source_schema_probe_not_map",
               "production_approved":False,"tile_xyz":[z,x,y]}
          def probe(url,read_all=False):
              req=urllib.request.Request(url,headers={"User-Agent":"HomePlannerMapEvidence/1.0"})
              with urllib.request.urlopen(req,timeout=45) as resp:
                  return resp.status,resp.headers.get("Content-Type"),resp.read(15000000 if read_all else 64)
          try:
              url=f"https://cyberjapandata.gsi.go.jp/xyz/experimental_bvmap/{z}/{x}/{y}.pbf"
              status,typ,raw=probe(url,True)
              out["gsi"]={"url":url,"status":status,"type":typ,"size":len(raw),"sha256":hashlib.sha256(raw).hexdigest()}
              layers=mapbox_vector_tile.decode(raw)
              out["gsi"]["layers"]=[{"name":name,"count":len(layer.get("features",[])),
                                    "sample_properties":[f.get("properties",{}) for f in layer.get("features",[])[:2]]}
                                   for name,layer in layers.items()]
          except Exception as e:
              out["gsi_error"]=type(e).__name__+": "+str(e)[:300]
          urls=[
             "https://nlftp.mlit.go.jp/ksj/gml/data/N02/N02-25/N02-25_GML.zip",
             "https://nlftp.mlit.go.jp/ksj/gml/data/N02/N02-2025/N02-25_GML.zip",
             "https://nlftp.mlit.go.jp/ksj/gml/data/N02/N02-25_GML.zip"]
          out["n02_probes"]=[]
          for url in urls:
              try:
                  status,typ,head=probe(url)
                  out["n02_probes"].append({"url":url,"status":status,"type":typ,"zip_signature":head[:4].hex()})
              except Exception as e:
                  out["n02_probes"].append({"url":url,"error":type(e).__name__+": "+str(e)[:120]})
          Path("geometry-discovery.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print("GSI_SOURCE",out.get("gsi",{}).get("status"),"LAYERS",[(x["name"],x["count"]) for x in out.get("gsi",{}).get("layers",[])])
          print("N02_STATUS",[(r.get("status"),r.get("zip_signature")) for r in out["n02_probes"]])
          print("Discovery only; no advertisement map generated")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: homeplanner-geometry-discovery
          path: geometry-discovery.json
          retention-days: 7
